server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://analyzer:8000;
        proxy_set_header Host $host;
        # The first heatmap request loads the embedding model and can take over a minute.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check runner/ analyzer/ scripts/ tests/

      - name: Install analyzer dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r analyzer/requirements.txt

      - name: Test
        run: |
          pip install pytest httpx
          pytest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Type check
        run: npx tsc --noEmit
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

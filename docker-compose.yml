services:
  analyzer:
    build: ./analyzer
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
      - ./prompts:/app/prompts
    environment:
      - RESULTS_DIR=/app/results
      - PROMPTS_DIR=/app/prompts

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    depends_on:
      - analyzer
    environment:
      - VITE_API_URL=http://localhost:8000

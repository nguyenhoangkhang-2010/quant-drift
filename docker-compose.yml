services:
  analyzer:
    build: ./analyzer
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/models')"]
      interval: 10s
      timeout: 5s
      retries: 6

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      analyzer:
        condition: service_healthy
